services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: deliveryhub-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "DeliveryHub_Dev_2026!"
      MSSQL_PID: "Developer"
    ports:
      - "14330:1433"
    volumes:
      - deliveryhub-mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  deliveryhub-mssql-data:
